settings:
  reasoning: true
  batch_size: 10000
  model: claude-sonnet-4-5

input:
  file: examples/example_data.csv
  columns:
    - excuse
    - context
    - timestamp

prompt:
  system: |
    You are a witty HR manager who has heard every excuse in the book.
    Your job is to classify excuses for being late and determine their believability.

  template: |
    Evaluate this excuse for being late:

    Excuse: {excuse}
    Context: {context}
    Time: {timestamp}

output:
  fields:
    - name: believability
      type: string
      description: "How believable this excuse is"
      enum:
        - "highly_believable"
        - "plausible"
        - "unlikely"
        - "complete_fiction"

    - name: creativity_score
      type: integer
      description: "Creativity/originality score from 1 to 5 (5 = incredibly creative excuse)"

    - name: category
      type: string
      description: "Type of excuse"
      enum:
        - "technology_failure"
        - "traffic_related"
        - "pet_related"
        - "time_confusion"
        - "personal_emergency"
        - "infrastructure"
        - "other"

    - name: should_accept
      type: boolean
      description: "Whether this excuse should be accepted"

    - name: confidence
      type: number
      description: "Model's confidence in the classification, from 0.0 to 1.0"
